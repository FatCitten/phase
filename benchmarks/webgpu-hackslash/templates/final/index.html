<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Phaseblade — WebGPU Raycast Hack & Slash</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#090b10;color:#fff;font-family:ui-monospace,monospace}canvas{width:100vw;height:100vh;display:block}
    #hud{position:fixed;inset:0;pointer-events:none;padding:18px;box-sizing:border-box;text-shadow:0 2px 5px #000;display:flex;justify-content:space-between;align-items:flex-start}
    #help{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000a;padding:10px 14px;border:1px solid #fff3;border-radius:8px;pointer-events:none}
    .accent{color:#ffcc66}#status{max-width:40ch}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"><div><b class="accent">PHASEBLADE</b><div id="status">Initializing WebGPU…</div></div><div id="stats"></div></div>
  <div id="help">Click to lock mouse · WASD move · mouse turn · click slash</div>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
